        <div data-statement-for="root-discriminant">As the degree of a number field <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>K</mi></mrow><annotation encoding="application/x-tex">K</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span></span></span></span></span> grows, its root discriminant <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">∣</mi><mi mathvariant="normal">disc</mi><mo>⁡</mo><mi>K</mi><msup><mi mathvariant="normal">∣</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mo stretchy="false">[</mo><mi>K</mi><mo>:</mo><mi mathvariant="double-struck">Q</mi><mo stretchy="false">]</mo></mrow></msup></mrow><annotation encoding="application/x-tex">|\operatorname{disc} K|^{1/[K:\mathbb Q]}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.138em;vertical-align:-0.25em;"></span><span class="mord">∣</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop"><span class="mord mathrm">disc</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">K</span><span class="mord"><span class="mord">∣</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1/</span><span class="mopen mtight">[</span><span class="mord mathnormal mtight" style="margin-right:0.0715em;">K</span><span class="m         <div data-statement-for="finite-tower">A number field of root discriminant below <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>8</mn><mi>π</mi><msup><mi>e</mi><mi>γ</mi></msup><mo>≈</mo><mn>44.763</mn></mrow><annotation encoding="application/x-tex">8\pi e^\gamma\approx 44.763</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6644em;"></span><span class="mord">8</span><span class="mord mathnormal" style="margin-right:0.0359em;">π</span><span class="mord"><span class="mord mathnormal">e</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.6644em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight" style="margin-right:0.0556em;">γ</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≈</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">44.763</span></span></span></span> has no infinite unramified tower.</div>
        <div data-statement-for="complex-zero">Deciding whether a system of integer-coefficient polynomials has a common complex zero belongs to <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">A</mi><mi mathvariant="normal">M</mi></mrow><annotation encoding="application/x-tex">\mathrm{AM}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord"><span class="mord mathrm">AM</span></span></span></span></span></span>, the Arthur–Merlin class of randomized verification protocols.</div>
        <div data-statement-for="resultant-zero">For a square system of homogeneous polynomials with integer coefficients, deciding whether the multivariate resultant vanishes belongs to <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">A</mi><mi mathvariant="normal">M</mi></mrow><annotation encoding="application/x-tex">\mathrm{AM}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord"><span class="mord mathrm">AM</span></span></span></span></span></span>.</div>

        <div data-statement-for="ray-class-random-walk">For these narrow ray-class Cayley graphs with sufficiently large <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>Q</mi></mrow><annotation encoding="application/x-tex">Q</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">Q</span></span></span></span></span>, a walk of <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>O</mi><mo stretchy="false">(</mo><mi>log</mi><mo>⁡</mo><mi mathvariant="normal">∣</mi><mi>G</mi><mi mathvariant="normal">∣</mi><mi mathvariant="normal">/</mi><mi>log</mi><mo>⁡</mo><mi>log</mi><mo>⁡</mo><mi>Q</mi><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O(\log |G|/\log\log Q)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="mopen">(</span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord">∣</span><span class="mord mathnormal">G</span><span class="mord">∣/</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">Q</span><span class="mclose">)</span></span></span></span></span> steps from any vertex reaches a fixed subset <span class="         <div data-statement-for="isogeny-discrete-log">If a discrete-log algorithm works on a fraction <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>μ</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\mu&gt;0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7335em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">μ</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span> of the curves in one of these isogeny graphs, a randomized reduction solves discrete logs on any curve in the same graph with expected overhead polynomial in <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>log</mi><mo>⁡</mo><mi>q</mi></mrow><annotation encoding="application/x-tex">\log q</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8889em;vertical-align:-0.1944em;"></span><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0359em;">q</span></span></span></span></span> times <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mi>μ</mi></mrow><annotation encoding="application/x-tex">1/\mu</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" st an></span></span></span></span></span>, deciding whether they have a common solution over the algebraic closure of <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="double-struck">Q</mi><mo stretchy="false">(</mo><msub><mi>t</mi><mn>1</mn></msub><mo separator="true">,</mo><mo>…</mo><mo separator="true">,</mo><msub><mi>t</mi><mi>m</mi></msub><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">\mathbb{Q}(t_1,\dots,t_m)</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mord mathbb">Q</span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal">t</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.3011em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">1</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="minner">…</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord"><span class="mord mathnormal">t</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:0em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">m</span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span></span> belongs to <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">A</mi><mi mathvariant="normal">M</mi></mrow><annotation encoding="application/x-tex">\mathrm{AM}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord"><span class="mord mathrm">AM</span></span></span></span></span></span>.</div>
        <div data-statement-for="schubert-vanishing">For the classical types <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>A</mi><mo separator="true">,</mo><mi>B</mi><mo separator="true">,</mo><mi>C</mi><mo separator="true">,</mo><mi>D</mi></mrow><annotation encoding="application/x-tex">A,B,C,D</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.8778em;vertical-align:-0.1944em;"></span><span class="mord mathnormal">A</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0502em;">B</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0715em;">C</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal" style="margin-right:0.0278em;">D</span></span></span></span></span>, deciding whether a Schubert intersection coefficient vanishes belongs to both <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">A</mi><mi mathvariant="normal">M</mi></mrow><annotation encoding="application/x-tex">\mathrm{AM}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord"><span class="mord mathrm">AM</span></span></span></span></span></span> and <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi mathvariant="normal">c</mi><mi mathvariant="normal">o</mi><mi mathvariant="normal">A</mi><mi mathvariant="normal">M</mi></mrow><annotation encoding="application/x-tex">\mathrm{coAM}</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord"><span class="mord mathrm">coAM</span></span></span></span></span></span>. Both zero and nonzero answers admit Arthur–Merlin verification.</div>
        <div data-statement-for="four-prime-sums">Every integer <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>n</mi><mo>≥</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">n\ge2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7719em;vertical-align:-0.136em;"></span><span class="mord mathnormal">n</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≥</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span> can be expressed as a sum of at most four primes.</div>
        <div data-statement-for="goldbach-exceptions">The number of even integers from <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mn>4</mn></mrow><annotation encoding="application/x-tex">4</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">4</span></span></span></span></span> to <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>X</mi></mrow><annotation encoding="application/x-tex">X</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.6833em;"></span><span class="mord mathnormal" style="margin-right:0.0785em;">X</span></span></span></span></span> that fail to be sums of two primes is <span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><msub><mi>O</mi><mi>ε</mi></msub><mo stretchy="false">(</mo><msup><mi>X</mi><mrow><mn>1</mn><mi mathvariant="normal">/</mi><mn>2</mn><mo>+</mo><mi>ε</mi></mrow></msup><mo stretchy="false">)</mo></mrow><annotation encoding="application/x-tex">O_{\varepsilon}(X^{1/2+\varepsilon})</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1.138em;vertical-align:-0.25em;"></span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0278em;">O</span><span class="msupsub"><span class="vlist-t vlist-t2"><span class="vlist-r"><span class="vlist" style="height:0.1514em;"><span style="top:-2.55em;margin-left:-0.0278em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mathnormal mtight">ε</span></span></span></span></span><span class="vlist-s">​</span></span><span class="vlist-r"><span class="vlist" style="height:0.15em;"><span></span></span></span></span></span></span><span class="mopen">(</span><span class="mord"><span class="mord mathnormal" style="margin-right:0.0785em;">X</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.888em;"><span style="top:-3.063em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">1/2</span><span class="mbin mtight">+</span><span class="mord mathnormal mtight">ε</span></span></span></span></span></span></span></span></span><span class="mclose">)</span></span></span></span> for every <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>ε</mi><mo>&gt;</mo><mn>0</mn></mrow><annotation encoding="application/x-tex">\varepsilon&gt;0</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.5782em;vertical-align:-0.0391em;"></span><span class="mord mathnormal">ε</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">&gt;</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">0</span></span></span></span></span>.</div>
        <div data-statement-for="goldbach-short-intervals">For each real <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mi>x</mi><mo>≥</mo><mn>2</mn></mrow><annotation encoding="application/x-tex">x\ge 2</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:0.7719em;vertical-align:-0.136em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2778em;"></span><span class="mrel">≥</span><span class="mspace" style="margin-right:0.2778em;"></span></span><span class="base"><span class="strut" style="height:0.6444em;"></span><span class="mord">2</span></span></span></span></span>, the interval <span class="grh-math-unit"><span class="katex"><span class="katex-mathml"><math xmlns="http://www.w3.org/1998/Math/MathML"><semantics><mrow><mo stretchy="false">(</mo><mi>x</mi><mo separator="true">,</mo><mi>x</mi><mo>+</mo><mn>123</mn><msup><mrow><mi>log</mi><mo>⁡</mo></mrow><mn>2</mn></msup><mi>x</mi><mo stretchy="false">]</mo></mrow><annotation encoding="application/x-tex">(x,x+123\log^2 x]</annotation></semantics></math></span><span class="katex-html" aria-hidden="true"><span class="base"><span class="strut" style="height:1em;vertical-align:-0.25em;"></span><span class="mopen">(</span><span class="mord mathnormal">x</span><span class="mpunct">,</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">x</span><span class="mspace" style="margin-right:0.2222em;"></span><span class="mbin">+</span><span class="mspace" style="margin-right:0.2222em;"></span></span><span class="base"><span class="strut" style="height:1.1484em;vertical-align:-0.25em;"></span><span class="mord">123</span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mop"><span class="mop">lo<span style="margin-right:0.0139em;">g</span></span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:0.8984em;"><span style="top:-3.1473em;margin-right:0.05em;"><span class="pstrut" style="height:2.7em;"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight">2</span></span></span></span></span></span></span></span><span class="mspace" style="margin-right:0.1667em;"></span><span class="mord mathnormal">x</span><span class="mclose">]</span></span></span></span></span> contains an even integer that is the sum of two primes.</div>

        <script type="application/json" id="grh-preview-data">{"nodes":[{"id":"grh","title":"Generalized Riemann Hypothesis","statement":"For every number field $K$, every nontrivial zero of its Dedekind zeta function $\\zeta_K(s)$ has real part $\\tfrac12$.","parents":[],"sources":[{"label":"Grenié and Molteni, 2019","url":"https://arxiv.org/abs/1709.07609"}]},{"id":"dirichlet-grh","title":"Dirichlet GRH","statement":"For every primitive Dirichlet character $\\chi$, every nontrivial zero of $L(s,\\chi)$ has real part $\\tfrac12$.","parents":["grh"],"sources":[{"label":"Cyclotomic zeta factorization, equation (2)","url":"https://doi.org/10.1112/blms.12904"}]},{"id":"rh","title":"Riemann Hypothesis","statement":"Every nontrivial zero of the Riemann zeta function $\\zeta(s)$ has real part $\\tfrac12$.","parents":["dirichlet-grh"],"sources":[{"label":"Enrico Bombieri, Clay problem description","url":"https://www.claymath.org/wp-content/uploads/2022/05/riemann.pdf"}]},{"id":"miller-witness","title":"Small Miller witnesses","statement":"Every odd composite integer $n$ has a Miller–Rabin compositeness witness at most $2(\\log n)^2$, where $\\log$ is the natural logarithm.","parents":["dirichlet-grh"],"sources":[{"label":"Bach, 1990","url":"https://www.jstor.org/stable/2008811"}]},{"id":"miller-test","title":"Deterministic primality testing","statement":"Miller’s deterministic test decides whether an input integer is prime in time polynomial in the number of bits of the input.","parents":["miller-witness"],"sources":[{"label":"Miller’s primality test","url":"https://www.cs.cmu.edu/~glmiller/Publications/Papers/Mi76.pdf"},{"label":"AKS primality test","url":"https://annals.math.princeton.edu/2004/160-2/p12"}],"status":"AKS also proved unconditional deterministic polynomial-time primality testing."},{"id":"nonresidue","title":"Small quadratic nonresidues","statement":"For every odd prime $p$, the least quadratic nonresidue modulo $p$ is $O((\\log p)^2)$.","parents":["dirichlet-grh"],"sources":[{"label":"Ankeny, 1952","url":"https://www.jstor.org/stable/1969420"}]},{"id":"modular-sqrt","title":"Fast square roots modulo primes","statement":"Given an odd prime $p$ and a quadratic residue $a$, a square root of $a$ modulo $p$ can be found deterministically in time polynomial in $\\log p$.","parents":["nonresidue"],"sources":[{"label":"Adleman, Manders and Miller, 1977","url":"https://www.cs.cmu.edu/~glmiller/Publications/AMM77.pdf"}]},{"id":"irreducible-polynomials","title":"Construct irreducible polynomials","statement":"Given a prime $p$ and a positive degree $d$, a deterministic algorithm produces a degree-$d$ irreducible polynomial over $\\mathbb F_p$ in time polynomial in $d$ and $\\log p$.","parents":["grh"],"sources":[{"label":"Adleman and Lenstra, 1986","url":"https://pub.math.leidenuniv.nl/~lenstrahw/PUBLICATIONS/1986a/art.pdf"}]},{"id":"finite-field","title":"Deterministic finite-field construction","statement":"Given a prime $p$ and positive integer $d$, an explicit presentation of the finite field $\\mathbb F_{p^d}$ can be constructed deterministically in time polynomial in $d$ and $\\log p$.","parents":["irreducible-polynomials"],"sources":[{"label":"Adleman and Lenstra, 1986","url":"https://pub.math.leidenuniv.nl/~lenstrahw/PUBLICATIONS/1986a/art.pdf"}]},{"id":"ternary-goldbach","title":"Ternary Goldbach","statement":"Every odd integer greater than five is a sum of three primes.","parents":["dirichlet-grh"],"sources":[{"label":"The 1997 proof under GRH","url":"https://ir.cwi.nl/pub/25478/"},{"label":"Helfgott’s unconditional proof","url":"https://arxiv.org/abs/1312.7748"}],"status":"Helfgott proved the full theorem unconditionally."},{"id":"euclidean-classes","title":"Euclidean ideal classes","statement":"If the ring of integers has infinitely many units and its ideal class group is cyclic, each generating ideal class is Euclidean.","parents":["grh"],"sources":[{"label":"Lenstra, Proposition 2.2","url":"https://www.numdam.org/item/AST_1979__61__121_0.pdf"}]},{"id":"euclidean-pid","title":"Euclidean algorithms in number fields","statement":"The ring of integers of a number field with class number one and infinitely many units admits a Euclidean algorithm.","parents":["euclidean-classes"],"sources":[{"label":"Weinberger, 1973","url":"https://doi.org/10.1090/pspum/024/0337902"},{"label":"Lenstra, Proposition 2.2","url":"https://www.numdam.org/item/AST_1979__61__121_0.pdf"}]},{"id":"ray-class-expansion","title":"Ray class graphs expand","statement":"Let $K$ have fixed degree, and let $Q$ be its absolute discriminant times the modulus norm. For each fixed $B>2$, the narrow ray-class Cayley graphs generated by prime ideals of prime norm up to $(\\log Q)^B$ and their inverses have a uniform spectral gap for sufficiently large $Q$.","parents":["grh"],"sources":[{"label":"Jao, Miller and Venkatesan, 2009","url":"https://arxiv.org/abs/0811.0647"}]},{"id":"isogeny-expansion","title":"Ordinary isogeny graphs expand","statement":"Ordinary elliptic curves over $\\mathbb F_q$ with the same point count and isomorphic geometric endomorphism rings form an expander graph using prime-degree isogenies of degree at most $(\\log(4q))^B$ for fixed $B>2$ and sufficiently large $q$.","parents":["ray-class-expansion"],"sources":[{"label":"Jao, Miller and Venkatesan, 2009","url":"https://arxiv.org/abs/0811.0647"}]},{"id":"chebotarev","title":"Effective Chebotarev","statement":"Fix a finite Galois extension $L/K$ with group $G$ and a conjugacy class $C$. The count of unramified prime ideals of norm at most $x$ with Frobenius in $C$ is $$\\frac{|C|}{|G|}\\operatorname{Li}(x)+O_{L/K}(\\sqrt{x}\\log x).$$","parents":["grh"],"sources":[{"label":"Grenié–Molteni, Corollary 1.2","url":"https://arxiv.org/abs/1709.07609"}]},{"id":"progression-counts","title":"Prime counts in residue classes","statement":"Fix a modulus $q$ and a residue $a$ coprime to $q$. The number $\\pi(x;q,a)$ of primes at most $x$ congruent to $a$ modulo $q$ satisfies $$\\pi(x;q,a)=\\frac{\\operatorname{Li}(x)}{\\varphi(q)}+O_q(\\sqrt{x}\\log x).$$","parents":["chebotarev"],"sources":[{"label":"Grenié and Molteni, 2019","url":"https://arxiv.org/abs/1709.07609"},{"label":"Bach and Sorenson, 1996","url":"https://digitalcommons.butler.edu/facsch_papers/1121/"}]},{"id":"dirichlet","title":"Dirichlet’s theorem","statement":"If $q\\ge 1$ and $\\gcd(a,q)=1$, the progression $a,a+q,a+2q,\\ldots$ contains infinitely many primes.","parents":["progression-counts"],"sources":[{"label":"Dirichlet’s original proof","url":"https://arxiv.org/abs/0808.1408"}],"status":"Proved unconditionally by Dirichlet in 1837."},{"id":"least-in-progression","title":"First prime in a residue class","statement":"If $q\\ge 2$ and $\\gcd(a,q)=1$, the first prime congruent to $a$ modulo $q$ is less than $2(q\\log q)^2$.","parents":["dirichlet-grh"],"sources":[{"label":"Bach and Sorenson, 1996","url":"https://digitalcommons.butler.edu/facsch_papers/1121/"}]},{"id":"prime-race","title":"Prime race distributions","statement":"For any fixed modulus and list of reduced residue classes, the normalized errors in their prime counts have a joint limiting distribution on a logarithmic scale.","parents":["dirichlet-grh"],"sources":[{"label":"Rubinstein–Sarnak, Theorem 1.1","url":"https://www.math.uwaterloo.ca/~mrubinst/publications/Chebyshev.pdf"}]},{"id":"schoenfeld","title":"Sharper prime counts","statement":"Let $\\pi(x)$ count primes at most $x$ and use the principal-value logarithmic integral $\\operatorname{Li}(x)$. For every $x\\ge 2657$, $$|\\pi(x)-\\operatorname{Li}(x)|\u003c\\frac{\\sqrt{x}\\log x}{8\\pi}.$$","parents":["rh"],"sources":[{"label":"Schoenfeld, 1976","url":"https://doi.org/10.1090/S0025-5718-1976-0457374-X"}]},{"id":"reciprocal-primes","title":"Sum of reciprocal primes","statement":"Let $B_1$ be the Meissel–Mertens constant. For $x\\ge 13.5$, $$\\left|\\sum_{p\\le x}\\frac1p-\\log\\log x-B_1\\right|\u003c\\frac{3\\log x+4}{8\\pi\\sqrt{x}}.$$","parents":["schoenfeld"],"sources":[{"label":"Schoenfeld, Corollary 2","url":"https://doi.org/10.1090/S0025-5718-1976-0457374-X"}]},{"id":"prime-gaps","title":"Bounds on prime gaps","statement":"The gap from a prime $p$ to the next prime is $O(\\sqrt p\\log p)$.","parents":["rh"],"sources":[{"label":"Carneiro–Milinovich–Soundararajan, Theorem 5","url":"https://arxiv.org/abs/1708.04122"}]},{"id":"mobius-cancellation","title":"Möbius cancellation","statement":"For each $\\varepsilon>0$, the partial sums of the Möbius function satisfy $$\\sum_{n\\le x}\\mu(n)=O_\\varepsilon(x^{1/2+\\varepsilon}).$$","parents":["rh"],"sources":[{"label":"Soundararajan, partial sums of the Möbius function","url":"https://arxiv.org/abs/0705.0723"},{"label":"Hurst, computations of the Mertens function","url":"https://www.ams.org/journals/mcom/2018-87-310/S0025-5718-2017-03275-0/S0025-5718-2017-03275-0.pdf"}],"status":"Equivalent to RH"},{"id":"lagarias","title":"A divisor-sum criterion","statement":"For every positive integer $n$, let $\\sigma(n)$ be the sum of its positive divisors and $H_n=\\sum_{j=1}^n 1/j$. Then $$\\sigma(n)\\le H_n+e^{H_n}\\log H_n.$$","parents":["rh"],"sources":[{"label":"Lagarias, 2002","url":"https://arxiv.org/abs/math/0008177"}],"status":"Equivalent to RH"},{"id":"artin-density","title":"Density of primitive roots","statement":"For each fixed nonsquare integer $g\\ne -1$, the primes $p$ for which $g$ generates $(\\mathbb Z/p\\mathbb Z)^\\times$ have an explicit positive density among all primes.","parents":["grh"],"sources":[{"label":"Hooley, 1967","url":"https://doi.org/10.1515/crll.1967.225.209"},{"label":"Fan and Pollack, density formula (1.2)–(1.3)","url":"https://arxiv.org/html/2505.05601v2"}]},{"id":"longest-decimals","title":"Longest repeating decimals","statement":"About $37.4\\%$ of primes $p$ have a repeating block of length $p-1$ in the decimal expansion of $1/p$. For example, $1/7=0.\\overline{142857}$.","parents":["artin-density"],"sources":[{"label":"Hooley, 1967","url":"https://doi.org/10.1515/crll.1967.225.209"},{"label":"Fan and Pollack, density formula (1.2)–(1.3)","url":"https://arxiv.org/html/2505.05601v2"}]},{"id":"primitive-runs","title":"Consecutive primes with primitive root 2","statement":"For every positive integer $m$, there are $m$ consecutive primes for which $2$ is a primitive root modulo each prime.","parents":["grh"],"sources":[{"label":"Pollack, Theorem 4.1","url":"https://arxiv.org/abs/1404.4007"}]},{"id":"littlewood","title":"Bound Dirichlet L-values at 1","statement":"For a large negative fundamental discriminant $D$, let $\\chi_D$ be its quadratic character. Then $L(1,\\chi_D)$ is bounded below and above by positive constant multiples of $1/\\log\\log|D|$ and $\\log\\log|D|$, respectively.","parents":["dirichlet-grh"],"sources":[{"label":"Lamzouri, Li and Soundararajan, class-number bounds","url":"https://arxiv.org/abs/1309.3595"}]},{"id":"quadratic-class-numbers","title":"Bounds on quadratic class numbers","statement":"For negative fundamental discriminants $D$ of large absolute value, the class number $h(D)$ satisfies $$\\frac{\\sqrt{|D|}}{\\log\\log|D|}\\ll h(D)\\ll \\sqrt{|D|}\\log\\log|D|.$$","parents":["littlewood"],"sources":[{"label":"Lamzouri, Li and Soundararajan, class-number bounds","url":"https://arxiv.org/abs/1309.3595"}]},{"id":"class-exponent-two","title":"Class-group exponent dividing two","statement":"An imaginary quadratic field whose ideal class group has exponent dividing $2$ has absolute discriminant at most $5{,}460$.","parents":["dirichlet-grh"],"sources":[{"label":"Weinberger, 1973","url":"https://doi.org/10.4064/aa-22-2-117-124"},{"label":"Kani, §2 and Corollary 23","url":"https://mast.queensu.ca/~kani/papers/2011K1.pdf"}]},{"id":"euler-65","title":"Euler’s 65 idoneal numbers","statement":"There are exactly $65$ positive integers $n$ for which the quadratic order of discriminant $-4n$ has class group of exponent dividing $2$. The largest is $1{,}848$.","parents":["class-exponent-two"],"sources":[{"label":"Kani, Corollary 23","url":"https://mast.queensu.ca/~kani/papers/2011K1.pdf"},{"label":"The idoneal number correspondence","url":"https://magma.maths.usyd.edu.au/~watkins/papers/IDONcorr.pdf"}]},{"id":"small-generators","title":"Small prime ideals generate class groups","statement":"The ideal class group of a number field of absolute discriminant $D$ is generated by prime ideals of norm at most $12(\\log D)^2$.","parents":["grh"],"sources":[{"label":"Bach, 1990","url":"https://www.jstor.org/stable/2008811"},{"label":"Klagsbrun, Sherman and Weigandt, 2016","url":"https://arxiv.org/abs/1606.07178"}]},{"id":"class-2-rank","title":"A cubic class group has 2-rank 20","statement":"The class group of the totally real cubic subfield of the $2$-division field of Elkies’s $2006$ elliptic curve has $2$-rank exactly $20$.","parents":["small-generators"],"sources":[{"label":"Klagsbrun, Sherman and Weigandt, 2016","url":"https://arxiv.org/abs/1606.07178"}]},{"id":"elkies-rank","title":"Elkies’s curve has rank 28","statement":"The group of rational points of Elkies’s $2006$ elliptic curve has Mordell–Weil rank exactly $28$.","parents":["class-2-rank"],"sources":[{"label":"Klagsbrun–Sherman–Weigandt, Theorem 1(i)","url":"https://arxiv.org/abs/1606.07178"}]},{"id":"root-discriminant","title":"Lower bounds for root discriminants","statement":"As the degree of a number field $K$ grows, its root discriminant $|\\operatorname{disc} K|^{1/[K:\\mathbb Q]}$ has lower limit at least $8\\pi e^\\gamma\\approx 44.763$, where $\\gamma$ is Euler’s constant.","parents":["grh"],"sources":[{"label":"Odlyzko, root discriminant bounds","url":"https://www.numdam.org/item/JTNB_1990__2_1_119_0.pdf"},{"label":"Hajir and Maire, discriminant bounds in towers","url":"https://www.cambridge.org/core/services/aop-cambridge-core/content/view/642EE0EB7DF3C8BF2E566C7D809EDA42/S0010437X01000525a.pdf/tamely-ramified-towers-and-discriminant-bounds-for-number-fields.pdf"}]},{"id":"finite-tower","title":"Finite unramified towers","statement":"A number field of root discriminant below $8\\pi e^\\gamma\\approx 44.763$ has no infinite unramified tower.","parents":["root-discriminant"],"sources":[{"label":"Jones–Roberts, Section 3","url":"https://arxiv.org/abs/1404.0266"}]},{"id":"complex-zero","title":"Common complex zeros in Arthur–Merlin","statement":"Deciding whether a system of integer-coefficient polynomials has a common complex zero belongs to $\\mathrm{AM}$, the Arthur–Merlin class of randomized verification protocols.","parents":["grh"],"sources":[{"label":"Koiran, 1996","url":"https://archive.dimacs.rutgers.edu/TechnicalReports/abstracts/1996/96-27.html"}]},{"id":"resultant-zero","title":"Resultant vanishing in Arthur–Merlin","statement":"For a square system of homogeneous polynomials with integer coefficients, deciding whether the multivariate resultant vanishes belongs to $\\mathrm{AM}$.","parents":["complex-zero"],"sources":[{"label":"Grenet, Koiran and Portier, §2.1","url":"https://arxiv.org/abs/1210.1451"}]},{"id":"progression-short-intervals","title":"Short intervals in residue classes","statement":"There are absolute constants $x_0,C,c>0$ such that, for $x\\ge x_0$, $\\gcd(a,q)=1$, and $C\\varphi(q)\\sqrt{x}\\log x\\le h\\le x$, the interval $(x,x+h]$ contains at least $ch/(\\varphi(q)\\log x)$ primes congruent to $a$ modulo $q$.","parents":["dirichlet-grh"],"sources":[{"label":"Grenié, Molteni and Perelli, Theorem 1","url":"https://arxiv.org/abs/1602.02906"}]},{"id":"uniform-progression-errors","title":"Prime counts with growing moduli","statement":"Let $\\psi(x;q,a)$ be the count of prime powers up to $x$ congruent to $a$ modulo $q$, weighted by $\\log p$ for powers of $p$. Uniformly for $x\\ge2$ and $\\gcd(a,q)=1$, $$\\psi(x;q,a)=\\frac{x}{\\varphi(q)}+O(\\sqrt{x}\\log^2(qx)).$$","parents":["dirichlet-grh"],"sources":[{"label":"Grenié and Molteni, Theorem 1.1, cyclotomic case","url":"https://arxiv.org/abs/1709.07609"}]},{"id":"bombieri-vinogradov","title":"Bombieri–Vinogradov theorem","statement":"For every $A>0$ there is $B>0$ such that, after taking the largest weighted counting error among coprime residue classes for each modulus, the sum of those errors over $q\\le\\sqrt{x}/(\\log x)^B$ is $O_A(x/(\\log x)^A)$.","parents":["uniform-progression-errors"],"sources":[{"label":"Bombieri, 1965","url":"https://doi.org/10.1112/S0025579300005313"}],"status":"Also proved unconditionally by Bombieri and Vinogradov."},{"id":"prime-between-cubes","title":"Primes between consecutive cubes","statement":"For every sufficiently large positive integer $n$, there is a prime strictly between $n^3$ and $(n+1)^3$.","parents":["prime-gaps"],"sources":[{"label":"Carneiro, Milinovich and Soundararajan, prime-gap estimate","url":"https://arxiv.org/abs/1708.04122"},{"label":"Ingham, unconditional prime-gap estimate","url":"https://doi.org/10.1093/qmath/os-8.1.255"}],"status":"Also follows from Ingham’s unconditional bounds."},{"id":"rh-squarefree-count","title":"Counting squarefree integers","statement":"For every $\\varepsilon>0$, the number of positive integers at most $x$ indivisible by any prime square is $6x/\\pi^2+O_{\\varepsilon}(x^{11/35+\\varepsilon})$.","parents":["rh"],"sources":[{"label":"Liu, On the distribution of squarefree numbers","url":"https://doi.org/10.1016/j.jnt.2015.07.013"},{"label":"Mossinghoff, Oliveira e Silva and Trudgian, §1","url":"https://arxiv.org/abs/1912.04972"}]},{"id":"rh-zeta-moments","title":"Sharp bounds on zeta moments","statement":"For each fixed real $k\\ge0$, the average of $|\\zeta(1/2+it)|^{2k}$ over $T\\le t\\le2T$ is $O_k((\\log T)^{k^2})$ as $T$ grows.","parents":["rh"],"sources":[{"label":"Harper, Sharp conditional bounds for moments","url":"https://arxiv.org/abs/1305.4618"}]},{"id":"artin-uniform-count","title":"Primitive root counts as the base grows","statement":"Let $g$ be a nonsquare integer other than $-1$. The number of primes $p\\le x$ for which $g$ is a primitive root is asymptotic to $A(g)\\pi(x)$, where $A(g)$ is Artin’s density for $g$. This holds even when $g$ varies with $x$, provided $\\log x/\\log\\log(2|g|)\\to\\infty$.","parents":["grh"],"sources":[{"label":"Fan and Pollack, Theorem 1.1","url":"https://arxiv.org/html/2505.05601v2"}]},{"id":"least-prime-for-primitive-root","title":"First prime generated by a given base","statement":"For any nonsquare integer $g\\ne-1$, the smallest prime $p_g$ for which $g$ is a primitive root satisfies $p_g=O((\\log(2|g|))^{19})$, with an absolute constant.","parents":["grh"],"sources":[{"label":"Fan and Pollack, Theorem 1.2","url":"https://arxiv.org/html/2505.05601v2"}]},{"id":"average-prime-for-primitive-root","title":"Average first prime for a primitive root","statement":"For an integer $g$ other than $-1$ or a square, let $p_g$ be the least prime for which $g$ is a primitive root. The mean of $p_g$ over such $g$ with $|g|\\le X$ tends to $$\\sum_{p}\\varphi(p-1)\\prod_{r\u003cp}\\left(1-\\frac{\\varphi(r-1)}r\\right),$$ where $p$ and $r$ range over primes.","parents":["least-prime-for-primitive-root"],"sources":[{"label":"Fan and Pollack, Corollary 1.3","url":"https://arxiv.org/html/2505.05601v2"}]},{"id":"small-primitive-root","title":"Small primitive roots","statement":"The least positive integer that generates the nonzero residues modulo a prime $p$ is $O((\\log p)^6)$.","parents":["dirichlet-grh"],"sources":[{"label":"Shoup, Theorem 3","url":"https://www.shoup.net/papers/primroots.pdf"}]},{"id":"primitive-root-search","title":"Find the least primitive root","statement":"Given a prime $p$ and the prime factorization of $p-1$, the least positive primitive root modulo $p$ can be found deterministically in time polynomial in $\\log p$.","parents":["small-primitive-root"],"sources":[{"label":"Shoup, Theorem 3","url":"https://www.shoup.net/papers/primroots.pdf"}]},{"id":"totient-factorization","title":"Factoring from Euler’s totient","statement":"Given $n$ and its Euler totient $\\varphi(n)$, the prime factorization of $n$ can be computed deterministically in time polynomial in $\\log n$. Computing $\\varphi(n)$ from the factorization also takes polynomial time.","parents":["dirichlet-grh"],"sources":[{"label":"Miller, Theorem 3","url":"https://www.cs.cmu.edu/~glmiller/Publications/Papers/Mi76.pdf"}]},{"id":"smooth-polynomial-factoring","title":"Factoring over special prime fields","statement":"Degree-$d$ polynomials over $\\mathbb F_p$ can be factored deterministically in time polynomial in $d$ and $\\log p$ when the largest prime factor of $p-1$ is at most a fixed power of $\\log p$.","parents":["grh"],"sources":[{"label":"Shoup, Smoothness and Factoring Polynomials over Finite Fields","url":"https://shoup.net/papers/smooth.pdf"}]},{"id":"class-exponent-eight","title":"Class groups of exponent dividing eight","statement":"There are exactly 1,046 imaginary quadratic fields of class-group exponent dividing $8$. Exactly 203 have exponent $4$ and 778 have exponent $8$.","parents":["dirichlet-grh"],"sources":[{"label":"Elsenhans, Klüners and Nicolae, Theorem 2 and Table 1","url":"https://arxiv.org/abs/1803.02056"}]},{"id":"class-number-cutoff","title":"A finite cutoff for class number 2,000","statement":"Every imaginary quadratic field of class number at most $2{,}000$ has absolute discriminant at most $8{,}213{,}527{,}466$.","parents":["grh"],"sources":[{"label":"Garcia, Grenié, Lee and Molteni, Equation (10)","url":"https://arxiv.org/html/2610.14257v1"}],"status":"Preprint"},{"id":"class-number-2000-list","title":"Complete list through class number 2,000","statement":"There are exactly $16{,}453{,}493$ imaginary quadratic fields of class number at most $2{,}000$. The largest absolute discriminant among them is $1{,}062{,}350{,}083$.","parents":["class-number-cutoff"],"sources":[{"label":"Garcia, Grenié, Lee and Molteni, Table 1","url":"https://arxiv.org/html/2610.14257v1"},{"label":"Molteni, full discriminant lists","url":"https://sites.unimi.it/molteni/research/class_numbers/class_numbers.html"}],"status":"Preprint"},{"id":"class-2-rank-22","title":"A cubic class group has 2-rank 22","statement":"The class group of the cubic subfield of the $2$-division field of Elkies’s curve $E_{27}$ has $2$-rank exactly $22$. The cubic field has one real embedding and one pair of complex embeddings.","parents":["small-generators"],"sources":[{"label":"Klagsbrun, Sherman and Weigandt, Theorem 4 and §5.5","url":"https://arxiv.org/pdf/1606.07178"}]},{"id":"elkies-rank-27","title":"Another Elkies curve has rank 27","statement":"The group of rational points on Elkies’s curve $E_{27}$ has Mordell–Weil rank exactly $27$.","parents":["class-2-rank-22"],"sources":[{"label":"Klagsbrun, Sherman and Weigandt, Theorem 3(i)","url":"https://arxiv.org/pdf/1606.07178"}]},{"id":"curves-ranks-20-24","title":"Five curves have ranks 20 through 24","statement":"For each $r\\in\\{20,21,22,23,24\\}$, the specific elliptic curve $E_r$ in Klagsbrun, Sherman and Weigandt’s Theorem 5 has Mordell–Weil rank exactly $r$ over $\\mathbb Q$.","parents":["small-generators"],"sources":[{"label":"Klagsbrun, Sherman and Weigandt, Theorem 5 and Appendix A","url":"https://arxiv.org/pdf/1606.07178"}]},{"id":"ray-class-random-walk","title":"Fast random walks on ray class graphs","statement":"For these narrow ray-class Cayley graphs with sufficiently large $Q$, a walk of $O(\\log |G|/\\log\\log Q)$ steps from any vertex reaches a fixed subset $S$ with probability at least $|S|/(2|G|)$, where $G$ is the ray class group and $Q$ is the absolute discriminant times the modulus norm.","parents":["ray-class-expansion"],"sources":[{"label":"Jao, Miller and Venkatesan, Corollary 1.3","url":"https://arxiv.org/pdf/0811.0647"}]},{"id":"isogeny-discrete-log","title":"Discrete logs across comparable curves","statement":"If a discrete-log algorithm works on a fraction $\\mu>0$ of the curves in one of these isogeny graphs, a randomized reduction solves discrete logs on any curve in the same graph with expected overhead polynomial in $\\log q$ times $1/\\mu$.","parents":["isogeny-expansion"],"sources":[{"label":"Jao, Miller and Venkatesan, Theorem 1.6","url":"https://arxiv.org/pdf/0811.0647"}]},{"id":"modular-unit-expansion","title":"Expanders on the units modulo an integer","statement":"For fixed $B>2$ and large modulus $m$, the graph on $(\\mathbb Z/m\\mathbb Z)^\\times$ generated by multiplication by primes $p\\leq(\\log m)^B$ coprime to $m$ and their inverses is an expander.","parents":["ray-class-expansion"],"sources":[{"label":"Jao, Miller and Venkatesan, example after Corollary 1.3","url":"https://arxiv.org/pdf/0811.0647"}]},{"id":"quadratic-unramified-cutoff","title":"Small imaginary quadratic fields have finite towers","statement":"An imaginary quadratic field $K$ with absolute discriminant $|D_K|\\le 2003$ has a maximal unramified extension of finite degree over $K$.","parents":["finite-tower"],"sources":[{"label":"Yamamura, §2","url":"https://www.numdam.org/item/JTNB_1997__9_2_405_0/"}]},{"id":"class-group-torsion","title":"Bounds on class-group torsion","statement":"In a number field $K$ of degree $d\\ge 2$, the number of ideal classes killed by $\\ell$ is $O_{d,\\ell,\\varepsilon}(|D_K|^{1/2-1/(2\\ell(d-1))+\\varepsilon})$ for every integer $\\ell\\ge 1$ and every $\\varepsilon>0$.","parents":["chebotarev"],"sources":[{"label":"Ellenberg and Venkatesh, Proposition 1","url":"https://people.math.wisc.edu/~ellenberg/Scholz-submit-july17.pdf"}]},{"id":"class-group-below-four","title":"Smaller class-group generators","statement":"If $K$ has degree $n\\ge 5$ and absolute discriminant $\\Delta$, the ideal class group is generated by prime ideals of norm at most $(4-1/(2n))(\\log\\Delta)^2$.","parents":["grh"],"sources":[{"label":"Grenié and Molteni, Theorem 1","url":"https://arxiv.org/abs/2212.09461v2"}]},{"id":"complex-dimension","title":"Complex dimension in Arthur–Merlin","statement":"Given integer polynomial equations and an integer $d\\ge 0$, deciding whether their common complex zero set has dimension at least $d$ belongs to $\\mathrm{AM}$.","parents":["complex-zero"],"sources":[{"label":"Koiran, 1997","url":"https://doi.org/10.1109/SFCS.1997.646091"}]},{"id":"parametric-complex-zero","title":"Polynomial feasibility with parameters","statement":"Given polynomial equations with rational-function coefficients in formal parameters $t_1,\\dots,t_m$, deciding whether they have a common solution over the algebraic closure of $\\mathbb{Q}(t_1,\\dots,t_m)$ belongs to $\\mathrm{AM}$.","parents":["complex-zero"],"sources":[{"label":"Ait El Manssour et al., Theorem 1","url":"https://arxiv.org/abs/2408.13027"}]},{"id":"schubert-vanishing","title":"Schubert coefficients in Arthur–Merlin","statement":"For the classical types $A,B,C,D$, deciding whether a Schubert intersection coefficient vanishes belongs to both $\\mathrm{AM}$ and $\\mathrm{coAM}$. Both zero and nonzero answers admit Arthur–Merlin verification.","parents":["complex-zero"],"sources":[{"label":"Pak and Robichaux, Theorem 1.1","url":"https://www.cambridge.org/core/journals/forum-of-mathematics-sigma/article/vanishing-of-schubert-coefficients-via-the-effective-hilbert-nullstellensatz/D77AAE02190D78722AB74667FF85AA85"}]},{"id":"four-prime-sums","title":"At most four primes suffice","statement":"Every integer $n\\ge2$ can be expressed as a sum of at most four primes.","parents":["ternary-goldbach"],"sources":[{"label":"Pintz, Consequence of ternary Goldbach, p. 388","url":"https://jtnb.centre-mersenne.org/article/JTNB_2009__21_2_357_0.pdf"},{"label":"Helfgott’s unconditional ternary Goldbach proof","url":"https://arxiv.org/abs/1312.7748"}],"status":"This also follows unconditionally from Helfgott’s theorem."},{"id":"goldbach-exceptions","title":"Square-root bound on binary Goldbach exceptions","statement":"The number of even integers from $4$ to $X$ that fail to be sums of two primes is $O_{\\varepsilon}(X^{1/2+\\varepsilon})$ for every $\\varepsilon>0$.","parents":["dirichlet-grh"],"sources":[{"label":"Hardy and Littlewood, Partitio Numerorum V","url":"https://doi.org/10.1112/plms/s2-22.1.46"}]},{"id":"goldbach-short-intervals","title":"Two-prime sums in short intervals","statement":"For each real $x\\ge 2$, the interval $(x,x+123\\log^2 x]$ contains an even integer that is the sum of two primes.","parents":["rh"],"sources":[{"label":"Chirre and Hagen, 2026","url":"https://doi.org/10.1007/s40993-026-00767-6"}]}],"branches":[{"id":"primes-progressions","title":"Primes in progressions","tracks":[["grh","chebotarev","progression-counts","dirichlet"],["dirichlet-grh","least-in-progression"],["dirichlet-grh","prime-race"],["progression-short-intervals"],["bombieri-vinogradov"]],"featured":"progression-counts"},{"id":"ordinary-rh","title":"Ordinary RH","tracks":[["rh","schoenfeld","reciprocal-primes"],["rh","prime-gaps"],["rh","mobius-cancellation"],["rh","lagarias"],["prime-between-cubes"],["rh-squarefree-count"],["rh-zeta-moments"]]},{"id":"primitive-roots","title":"Primitive roots and decimals","tracks":[["grh","artin-density","longest-decimals"],["grh","primitive-runs"],["artin-uniform-count"],["average-prime-for-primitive-root"]]},{"id":"finite-fields","title":"Primality and finite fields","tracks":[["dirichlet-grh","miller-witness","miller-test"],["dirichlet-grh","nonresidue","modular-sqrt"],["grh","irreducible-polynomials","finite-field"],["primitive-root-search"],["totient-factorization"],["smooth-polynomial-factoring"]]},{"id":"imaginary-quadratic","title":"Imaginary quadratic fields","tracks":[["dirichlet-grh","littlewood","quadratic-class-numbers"],["dirichlet-grh","class-exponent-two","euler-65"],["class-exponent-eight"],["class-number-2000-list"]]},{"id":"elliptic-rank","title":"Elliptic curve rank","tracks":[["grh","small-generators","class-2-rank","elkies-rank"],["elkies-rank-27"],["curves-ranks-20-24"]]},{"id":"expanders","title":"Expander graphs","tracks":[["grh",
